name: API CI

on:
  workflow_call:
  push:
    branches:
      - develop
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
      - ".node-version"
      - ".gitattributes"

permissions:
  contents: read

jobs:
  test:
    name: Typecheck y tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: takeandgo
        ports:
          # Los guards de persistencia requieren 127.0.0.1:5434/takeandgo.
          - "127.0.0.1:5434:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d takeandgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/takeandgo

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Configurar npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Instalar dependencias y generar Prisma Client
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar API
        run: npm run build

      - name: Aplicar migraciones
        run: npm run db:deploy

      - name: Ejecutar tests
        run: npm test